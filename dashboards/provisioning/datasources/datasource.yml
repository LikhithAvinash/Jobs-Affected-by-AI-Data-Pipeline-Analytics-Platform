apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    uid: postgres
    access: proxy
    url: postgres:5432
    database: job_market_db
    user: pipeline_user
    secureJsonData:
      password: pipeline_pass
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    isDefault: true
    editable: true
